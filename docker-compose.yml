services:
  postgres:
    image: docker.io/library/postgres:17-alpine
    container_name: retailcore-pos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: retailcore_pos
      POSTGRES_USER: retailcore
      POSTGRES_PASSWORD: retailcore_dev_password
    network_mode: host
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retailcore -d retailcore_pos"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres-data:
